version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alemni_postgres
    restart: always
    environment:
      POSTGRES_DB: alemni_db
      POSTGRES_USER: alemni_user
      POSTGRES_PASSWORD: alemni_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alemni_user -d alemni_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alemni_api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - EnableSwagger=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=alemni_db;Username=alemni_user;Password=alemni_secret
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

