name: Alemni Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore backend/Alemni.sln

    - name: Build Solution
      run: dotnet build backend/Alemni.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test backend/Alemni.sln --configuration Release --no-build --verbosity normal

